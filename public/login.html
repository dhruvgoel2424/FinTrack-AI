<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack AI — Login</title>
  <meta name="description" content="Login to FinTrack AI — Your AI-powered student financial coach.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-page">
  <!-- Background orbs -->
  <div class="login-bg-orb orb1"></div>
  <div class="login-bg-orb orb2"></div>
  <div class="login-bg-orb orb3"></div>

  <div class="login-card fade-in">

    <div class="login-logo">
      <div class="logo-icon">💰</div>
      <h1>FinTrack AI</h1>
      <p>Your Smart Student Finance Coach</p>
    </div>

    <div class="login-tabs">
      <div class="login-tab active" id="tab-login" onclick="switchTab('login')">Login</div>
      <div class="login-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form">

      <div class="form-group">
        <label>College Email</label>
        <input type="email" id="login-email" placeholder="dhruv@college.edu" required autocomplete="email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <div style="position:relative">
          <input type="password" id="login-pass" placeholder="Enter your password" required style="padding-right:48px" autocomplete="current-password">
          <span onclick="togglePass()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-dim);font-size:18px" id="pass-eye">👁️</span>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); cursor:pointer">
          <input type="checkbox" style="width:auto; accent-color:var(--blue)"> Remember me
        </label>
        <a href="#" style="font-size:13px; color:var(--blue); text-decoration:none">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn" id="login-submit-btn">
        🚀 Login to Dashboard
      </button>

    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display:none">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="Dhruv" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Sharma" required>
        </div>
      </div>

      <div class="form-group">
        <label>College Email</label>
        <input type="email" placeholder="dhruv@college.edu" required>
      </div>

      <div class="form-group">
        <label>Course & Year</label>
        <select>
          <option>B.Tech CSE - 1st Year</option>
          <option>B.Tech CSE - 2nd Year</option>
          <option>B.Tech CSE - 3rd Year</option>
          <option>B.Tech CSE - 4th Year</option>
          <option>B.Com - 1st Year</option>
          <option>BBA - 2nd Year</option>
          <option>MBA - 1st Year</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Monthly Pocket Money (₹)</label>
        <input type="number" placeholder="8000" min="0">
      </div>

      <div class="form-group">
        <label>Create Password</label>
        <input type="password" placeholder="Min 8 characters" required>
      </div>

      <button type="button" class="login-btn" onclick="doSignup()">
        ✨ Create Account
      </button>

    </form>

    <div class="divider">or continue with</div>

    <div class="social-login">
      <div class="social-btn" title="Google" onclick="showToast('Google login coming soon!', 'info')">🟦</div>
      <div class="social-btn" title="GitHub" onclick="showToast('GitHub login coming soon!', 'info')">⬛</div>
      <div class="social-btn" title="Student ID" onclick="showToast('Student ID login coming soon!', 'info')">🎓</div>
    </div>

    <p style="text-align:center; margin-top:22px; font-size:12px; color:var(--text-dim)">
      By logging in, you agree to our 
      <a href="#" style="color:var(--blue); text-decoration:none">Terms</a> & 
      <a href="#" style="color:var(--blue); text-decoration:none">Privacy Policy</a>
    </p>

    <div style="text-align:center; margin-top:18px">
      <a href="index.html" style="font-size:13px; color:var(--text-muted); text-decoration:none">
        Skip Login → View Demo Dashboard
      </a>
    </div>

  </div>
</div>

<script src="script.js"></script>
<script>
  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
  }

  function togglePass() {
    const input = document.getElementById('login-pass');
    const eye = document.getElementById('pass-eye');
    if (input.type === 'password') {
      input.type = 'text';
      eye.textContent = '🙈';
    } else {
      input.type = 'password';
      eye.textContent = '👁️';
    }
  }

  function doSignup() {
    showToast('Account created! Redirecting to dashboard... 🎉');
    setTimeout(() => window.location.href = 'index.html', 1200);
  }
</script>

</body>
</html>
